name: ci
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -O2 -ffreestanding -o test_host tests/test_host.c core/ebpf.c core/helpers.c
      - run: ./test_host
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld gcc-riscv64-unknown-elf
      - run: LLD=ld.lld bash build.sh
      - run: |
          riscv64-unknown-elf-readelf -S build/fw_pmp.elf | tee sections.txt
          grep -q '\.monitor_text' sections.txt
          grep -q '\.attacker_text' sections.txt
      - name: no RAM symbols inside the STATUS window
        run: |
          if riscv64-unknown-elf-nm build/fw_pmp.elf | awk '$1 >= "20000100" && $1 < "20000280"' | grep -q .; then
            riscv64-unknown-elf-nm -n build/fw_pmp.elf | grep 20000
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fw_pmp
          path: |
            build/fw_pmp.bin
            build/pmp_probe.bin
  qemu-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-misc
      - run: LLD=ld.lld bash qemu/build_qemu.sh
      - run: |
          set -o pipefail
          timeout 30 qemu-system-riscv32 -M virt -bios none -kernel build/fw_qemu.elf -nographic | tee qemu.log
          grep -q "== SWEEP 8/8 MATCH ==" qemu.log
          timeout 30 qemu-system-riscv32 -M virt -bios none -kernel build/fw_load.elf -nographic | tee load.log
          grep -q "== LOAD PASS ==" load.log
          python3 tools/uart_frame.py | timeout 30 qemu-system-riscv32 -M virt -bios none -kernel build/fw_urx.elf -display none -serial stdio -monitor none | tee urx.log
          grep -q "== LOAD PASS ==" urx.log
          python3 tools/uart_frame.py --corrupt | timeout 30 qemu-system-riscv32 -M virt -bios none -kernel build/fw_urx.elf -display none -serial stdio -monitor none | tee urx_bad.log || true
          grep -q "== LOAD FAIL ==" urx_bad.log
